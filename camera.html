<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Home Camera</title>
    <!--
      This loads Tailwind CSS for styling.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!--
      This loads HLS.js, the library needed to play
      HLS (m3u8) video streams in your browser.
    -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /*
         A simple style to make the video player
         and page look good on all devices.
        */
        body {
            font-family: 'Inter', sans-serif;
        }
        .video-container {
            /* 16:9 Aspect Ratio */
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
        }
        .video-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-white">Strathmore Lake Camera</h1>
            <p class="text-lg text-gray-400">Live Stream</p>
        </header>

        <main>
            <!--
              The video player container.
              The JavaScript will target the <video> element inside.
            -->
            <div class="video-container rounded-lg shadow-2xl bg-black">
                <video id="videoPlayer" controls autoplay muted playsinline></video>
            </div>

            <!-- Status Message Box -->
            <div id="statusMessage" class="text-center text-yellow-400 mt-4 text-sm">
                Connecting to stream...
            </div>
        </main>
    </div>

    <script>
        // *** This URL is now automatically set based on your Cloudflared output! ***
        // Tunnel URL: https://isaac-proposition-leo-fish.trycloudflare.com
        // Stream Path: /homecam/index.m3u8
        const videoSrc = 'https://shannon-necessarily-davis-double.trycloudflare.com/homecam/index.m3u8'; // Your live public stream URL

        const video = document.getElementById('videoPlayer');
        const statusMessage = document.getElementById('statusMessage');

        if (Hls.isSupported()) {
            console.log("HLS.js is supported. Attaching player.");
            const hls = new Hls();
            
            // Log HLS.js events for debugging
            hls.on(Hls.Events.MEDIA_ATTACHED, () => {
                console.log('HLS.js: Video and HLS.js successfully attached');
            });
            
            hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                console.log('HLS.js: Manifest parsed successfully');
                statusMessage.textContent = 'Stream connected. Playing...';
                statusMessage.className = 'text-center text-green-400 mt-4 text-sm';
                // We try to play, but browsers may block autoplay
                video.play().catch(() => {
                    statusMessage.textContent = 'Stream loaded. Click play to start.';
                    statusMessage.className = 'text-center text-blue-400 mt-4 text-sm';
                });
            });

            // Handle errors
            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    switch(data.type) {
                        case Hls.ErrorTypes.NETWORK_ERROR:
                            console.error('HLS.js Error: Fatal network error', data);
                            statusMessage.textContent = 'Network Error. Could not load stream. Is the server running?';
                            break;
                        case Hls.ErrorTypes.MEDIA_ERROR:
                            console.error('HLS.js Error: Fatal media error', data);
                            statusMessage.textContent = 'Media Error. The stream may be corrupt.';
                            hls.recoverMediaError();
                            break;
                        default:
                            console.error('HLS.js Error: Unrecoverable error', data);
                            statusMessage.textContent = 'An unrecoverable error occurred.';
                            hls.destroy();
                            break;
                    }
                } else {
                     console.warn('HLS.js Error: Non-fatal error', data);
                }
                if (statusMessage.textContent !== 'Connecting to stream...') {
                   statusMessage.className = 'text-center text-red-500 mt-4 text-sm';
                }
            });

            // Bind the video source and attach the video element
            hls.loadSource(videoSrc);
            hls.attachMedia(video);

        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            // Fallback for devices that natively support HLS (like Safari)
            console.log("HLS.js not supported, but native HLS playback is. Using native player.");
            video.src = videoSrc;
            video.addEventListener('loadedmetadata', () => {
                statusMessage.textContent = 'Stream loaded. Playing...';
                statusMessage.className = 'text-center text-green-400 mt-4 text-sm';
                video.play();
            });
            video.addEventListener('error', () => {
                statusMessage.textContent = 'Error loading native stream.';
                statusMessage.className = 'text-center text-red-500 mt-4 text-sm';
            });
        } else {
            // Browser can't play HLS at all
            console.error("HLS is not supported by this browser.");
            statusMessage.textContent = 'Sorry, your browser does not support HLS video streaming.';
            statusMessage.className = 'text-center text-red-500 mt-4 text-sm';
        }

    </script>
</body>
</html>
