                            <button class="toggle-sidebar" title="Hide Sidebar" aria-label="Hide sidebar">☰</button>

            <div style="margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="default-reader-checkbox" style="width: auto; margin-right: 8px;">
                <label for="default-reader-checkbox">Default articles to Reader View</label>
            </div>
            <div class="modal-buttons">
                <button id="modal-cancel-btn">Cancel</button>

    <!-- Modal for editing an existing feed -->
    <div id="edit-feed-modal" class="modal-overlay">
        <div class="modal">
            <h2>Edit Favorite</h2>
            <p>Title</p>
            <input type="text" id="edit-feed-title">
            <p>URL</p>
            <input type="text" id="edit-feed-url">
            <p>Section</p>
            <select id="edit-feed-section" class="modal-input" style="width: 100%; margin-bottom: 16px; padding: 8px;"></select>
            <div style="margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="edit-private-only-checkbox" style="width: auto; margin-right: 8px;">
                <label for="edit-private-only-checkbox">Private Only</label>
            </div>
            <div style="margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="edit-new-tab-checkbox" style="width: auto; margin-right: 8px;">
                <label for="edit-new-tab-checkbox">Open in new tab</label>
            </div>
            <div style="margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="scrape-page-checkbox" style="width: auto; margin-right: 8px;">
                <label for="scrape-page-checkbox">Scrape stories from web page (non-RSS)</label>
            </div>
            <div style="margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="edit-default-reader-checkbox" style="width: auto; margin-right: 8px;">
                <label for="edit-default-reader-checkbox">Default articles to Reader View</label>
            </div>
            <div class="modal-buttons">
                <button id="edit-modal-cancel-btn">Cancel</button>
                <button id="edit-modal-save-btn">Save</button>
            </div>
        </div>

    <script type="module">
    import { stripHTML, sanitizeDescription, getCache, setCache, clearCache, downloadJson, shuffleArray, showMessage, debounce } from './utils.js';

    (function() {
        // --- APPLICATION VERSION ---
        const APP_VERSION = "11222026";

        // --- STATE MANAGEMENT ---
        let prefetchedFeeds = new Set();
        let loadedConfig = [];
        let CRITICAL_FEEDS = [];
        
        // Elements
        const rssInput = document.getElementById('rssUrl');
        const feedContainer = document.getElementById('feed');
        const errorContainer = document.getElementById('error');
        const feedTitle = document.getElementById('feed-title');

        // Tracker for active fetch request to prevent race conditions
        let currentFetchUrl = null;
        let currentFeedItems = [];
        let currentFeedTitle = '';
        let currentOpenInNewTab = false;
        let currentDefaultReaderMode = false;

        const MAX_RETRY_ATTEMPTS = 2;
        const INITIAL_RETRY_DELAY_MS = 1000;

        function normalizeUrl(rawUrl) {
            const trimmed = (rawUrl || '').trim();
            if (!trimmed) return '';
            // Leave relative local HTML files (e.g., "earth.html") untouched
            if (trimmed.endsWith('.html') && !trimmed.includes('/')) return trimmed;
            // Prepend https:// if no protocol (http:// or https://) is present
            if (!/^https?:\/\//i.test(trimmed)) {
                return `https://${trimmed}`;
            }
            return trimmed;
        }

        function formatHumanDate(rawDate) {
            if (!rawDate || rawDate === 'No date') return 'Date unavailable';
            const parsed = new Date(rawDate);
            if (isNaN(parsed.getTime())) return rawDate;

            const now = new Date();
            const diffMs = now - parsed;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);

            if (diffMins >= 0 && diffMins < 60) {
                return diffMins <= 1 ? 'Just now' : `${diffMins} minutes ago`;
            }
            if (diffHours >= 0 && diffHours < 24 && now.getDate() === parsed.getDate()) {
                return `Today at ${parsed.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            }

            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            if (yesterday.toDateString() === parsed.toDateString()) {
                return `Yesterday at ${parsed.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            }

            return parsed.toLocaleDateString(undefined, {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });
        }

        /**
         * Internal helper to fetch and parse RSS/XML from the proxy.
         * Handles retries, proxy errors, and browser-side DOMParser fallback.
         */
        async function _fetchAndParseFeed(url, attempt = 1) {
            // Call your new Netlify Function endpoint
            const isScrape = url.endsWith('#scrape');
            const endpoint = isScrape ? '/.netlify/functions/scrape-page' : '/.netlify/functions/rss-proxy';
            const apiUrl = `${endpoint}?url=${encodeURIComponent(url)}`;
            try {
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    let errorMsg = `HTTP Error ${response.status}: ${response.statusText}`;
                    try {
                        const errorData = await response.json();
                        if (errorData && (errorData.details || errorData.error)) {
                            errorMsg = `${errorData.error || 'Proxy Error'}: ${errorData.details || ''}`;
                        }
                    } catch (e) { /* Not JSON */ }

                    if (response.status === 422) {
                        throw new Error(`The proxy service is being blocked by ${new URL(url).hostname}. This often happens with major sites like ESPN or NYT.`);
                    }
                    if (response.status === 429) {
                        throw new Error(`Rate limit exceeded (429). The proxy service or the source site is throttling requests. Please wait a minute before refreshing again.`);
                    }
                    if (response.status === 404) {
                        throw new Error(`Proxy function not found (404). If testing locally, ensure you are using 'netlify dev' and the function is in 'netlify/functions/'.`);
                    }
                    throw new Error(errorMsg);
                }

                const data = await response.json();

                // Automatic fallback: if rss-proxy got an HTML page instead of XML, retry via scrape-page!
                if (!isScrape && data.error === 'Parse Error') {
                    console.log(`URL is HTML rather than XML, switching to scrape-page for ${url}`);
                    return _fetchAndParseFeed(`${url}#scrape`, attempt);
                }

                // Handle cases where the proxy returns a 200 but the body contains an error object
                if (data.error) {
                    throw new Error(`${data.error}: ${data.details || 'Unknown details'}`);
                }

                if (!data || !data.items || data.items.length === 0) {
                    throw new Error('No items in feed.');
                }

                const items = data.items.map(item => {
                    // RCP images are almost always inside the HTML content as entities
                    let extractedImg = item.thumbnail || (item.enclosure && item.enclosure.url);
                    
                    // Check for the custom mediaThumbnail field from our proxy
                    if (!extractedImg && item.mediaThumbnail && item.mediaThumbnail.$) {
                        extractedImg = item.mediaThumbnail.$.url;
                    }
                    
                    // Check for the custom mediaContent field (common in Fox News)
                    if (!extractedImg && item.mediaContent && item.mediaContent.$) {
                        extractedImg = item.mediaContent.$.url;
                    }
                    
                    if (!extractedImg) {
                        // Look inside encoded content
                        const rawHTML = (item.description || '') + (item.content || '');
                        // Decode once to see if <img> tags appear
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = rawHTML;
                        const searchPool = rawHTML + (tempDiv.textContent || '');
                        
                        const imgMatch = searchPool.match(/<img[^>]+src="([^">]+)"/i);
                        if (imgMatch) extractedImg = imgMatch[1];
                    }

                    return {
                        title: stripHTML(item.title || 'No title'),
                        link: stripHTML(item.link || '#'),
                        // Expanded fallback for different RSS parser formats
                        description: isScrape
                            ? (item.contentSnippet || 'No summary available.')
                            : sanitizeDescription(item.description || item.content || item.contentSnippet || item.summary),
                        pubDate: formatHumanDate(stripHTML(item.pubDate || '')),
                        image: extractedImg
                    };
                });

                return items;
            } catch (error) {
                console.error(`Fetch failed for ${url}:`, error);
                if (attempt < MAX_RETRY_ATTEMPTS) {
                    const delay = INITIAL_RETRY_DELAY_MS * Math.pow(2, attempt - 1);
                    console.log(`Retrying fetch for ${url} (attempt ${attempt + 1}) after ${delay}ms...`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return _fetchAndParseFeed(url, attempt + 1);
                }
                throw error;
            }
        }

        function renderPlaceholders(container, count = 3) {
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const placeholder = document.createElement('div');
                placeholder.className = 'feed-item-placeholder';
                container.appendChild(placeholder);
            }
        }

        function renderIframe(container, url) {
            container.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.style.width = '100%';
            iframe.style.height = 'calc(100vh - 160px)'; 
            iframe.style.border = 'none';
            container.appendChild(iframe);
        }

        async function prefetchFeed(url) {
            // Skip pseudo-protocols like scoreboard://
            if (!url || url.startsWith('scoreboard://') || url.endsWith('.html')) {
                prefetchedFeeds.add(url);
                return;
            }
            //Don't try to prefetch local HTML files as RSS feeds
            if (url.endsWith('.html')) {
                prefetchedFeeds.add(url);
                return;
            }
            // Find all links that match the URL, not just the first one.
            const links = Array.from(document.querySelectorAll(`.sidebar a[data-feed="${url}"]`));
            const loadingIcons = [];

            links.forEach(link => {
                const iconId = `loading-icon-${encodeURIComponent(url)}-${Math.random().toString(36).substr(2, 9)}`;
                const existingIcon = link.parentElement.querySelector('.loading-icon');
                if (existingIcon) existingIcon.remove();

                const loadingIcon = document.createElement('div');
                loadingIcon.className = 'loading-icon';
                loadingIcon.id = iconId;
                loadingIcon.style.display = 'inline-block';
                link.parentElement.appendChild(loadingIcon);
                loadingIcons.push(loadingIcon);
            });

            try {
                const items = await _fetchAndParseFeed(url);
                setCache(url, items);
                prefetchedFeeds.add(url);
                // Enable all matching links now that they are cached.
                links.forEach(link => link.classList.remove('disabled'));
            } catch (error) {
                console.error(`Prefetch failed for ${url}:`, error);
                if (links.length > 0) {
                    const title = links[0].getAttribute('data-title');
                    const errorContainer = document.getElementById('error');
                    errorContainer.innerHTML = `Failed to load ${title}: ${error.message}. <button onclick="fetchFeed('${url}', '${title}', null)">Retry</button>`;
                    errorContainer.style.display = 'block';
                }
            } finally {
                loadingIcons.forEach(icon => icon.remove());
            }
        }

        async function prefetchAllFeeds(forceRefresh = true) {
            const errorContainer = document.getElementById('error');
            const sidebar = document.querySelector('.sidebar');
            const links = Array.from(document.querySelectorAll('.sidebar a[data-feed]'));
            const activeLink = document.querySelector('.sidebar a.active');
            const activeFeedUrl = activeLink ? activeLink.getAttribute('data-feed') : null;
            const activeFeedTitle = activeLink ? activeLink.getAttribute('data-title') : null;

            // 1. Collect unique feed URLs that actually need fetching
            const uniqueUrls = new Set();
            links.forEach(link => {
                const feedUrl = link.getAttribute('data-feed');
                if (!feedUrl || feedUrl.endsWith('.html')) return;

                const cached = getCache(feedUrl);
                if (!forceRefresh && cached && cached.length > 0) {
                    // Already cached: mark as ready and enable the sidebar link immediately
                    prefetchedFeeds.add(feedUrl);
                    link.classList.remove('disabled');
                    return;
                }

                if (forceRefresh && cached) {
                    clearCache(feedUrl);
                    prefetchedFeeds.delete(feedUrl);
                }
                uniqueUrls.add(feedUrl);
            });

            // If everything was already cached on startup, stop quietly with zero network calls
            if (uniqueUrls.size === 0) return;

            sidebar.classList.add('loading');
            errorContainer.textContent = forceRefresh ? 'Refreshing feeds...' : 'Loading uncached feeds...';
            errorContainer.style.display = 'block';
            errorContainer.classList.add('notification');

            try {
                const orderedUrls = [
                    ...CRITICAL_FEEDS.filter(url => uniqueUrls.has(url)),
                    ...[...uniqueUrls].filter(url => !CRITICAL_FEEDS.includes(url))
                ];

                const totalFeeds = orderedUrls.length;
                let completedCount = 0;
                const BATCH_SIZE = 3;

                for (let i = 0; i < totalFeeds; i += BATCH_SIZE) {
                    const batch = orderedUrls.slice(i, i + BATCH_SIZE);

                    await Promise.allSettled(
                        batch.map(async (feedUrl) => {
                            if (!prefetchedFeeds.has(feedUrl)) {
                                await prefetchFeed(feedUrl);
                            }
                            completedCount++;
                            const progress = Math.round((completedCount / totalFeeds) * 100);
                            sidebar.style.setProperty('--progress', `${progress}%`);
                        })
                    );

                    if (i + BATCH_SIZE < totalFeeds) {
                        await new Promise(resolve => setTimeout(resolve, 250));
                    }
                }

                // Refresh active view only when user explicitly clicked the Refresh button
                if (forceRefresh && activeFeedUrl && activeFeedTitle) {
                    await fetchFeed(activeFeedUrl, activeFeedTitle, activeLink);
                }

                errorContainer.textContent = 'Feeds refreshed successfully!';
                errorContainer.classList.add('notification');
            } catch (error) {
                console.error('Error during prefetchAllFeeds:', error);
                errorContainer.textContent = 'Failed to refresh feeds. Please try again.';
                errorContainer.classList.remove('notification');
            } finally {
                sidebar.classList.remove('loading');
                sidebar.style.setProperty('--progress', '0%');
                setTimeout(() => {
                    errorContainer.style.display = 'none';
                    errorContainer.textContent = '';
                }, 2000);
            }
        }

        //#####

        let scoreboardRenderToken = 0;

        function getLocalDateStart(dateObj = new Date()) {
            return new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
        }

        function formatEspnDateParam(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}${m}${d}`;
        }

        function formatScoreboardDateLabel(dateObj) {
            const today = getLocalDateStart();
            const target = getLocalDateStart(dateObj);
            const diffDays = Math.round((target - today) / 86400000);

            const formatted = target.toLocaleDateString(undefined, {
                weekday: 'short',
                month: 'short',
                day: 'numeric',
                year: 'numeric'
            });

            if (diffDays === 0) return `Today · ${formatted}`;
            if (diffDays === -1) return `Yesterday · ${formatted}`;
            if (diffDays === 1) return `Tomorrow · ${formatted}`;
            return formatted;
        }

        async function renderSportsScoreboard(container, viewMode = 'scores', selectedDate = getLocalDateStart()) {
            const token = ++scoreboardRenderToken;
            const activeDate = getLocalDateStart(selectedDate);
            const dateParam = formatEspnDateParam(activeDate);
            const dateLabelText = formatScoreboardDateLabel(activeDate);

            const leagues = [
                { name: 'NFL', sport: 'football', league: 'nfl' },
                { name: 'NBA', sport: 'basketball', league: 'nba' },
                { name: 'MLB', sport: 'baseball', league: 'mlb' },
                { name: 'NHL', sport: 'hockey', league: 'nhl' }
            ];

            container.innerHTML = `
                <div class="scoreboard-toolbar">
                    <div class="scoreboard-date-nav">
                        <button id="prev-day-btn" class="sb-date-btn" type="button" title="Previous Day" aria-label="Previous day">←</button>
                        <button id="today-date-btn" class="sb-date-label" type="button" title="Jump to Today">${dateLabelText}</button>
                        <button id="next-day-btn" class="sb-date-btn" type="button" title="Next Day" aria-label="Next day">→</button>
                        <span class="scoreboard-updated">Loading ${viewMode}...</span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button id="toggle-view-btn" type="button">${viewMode === 'scores' ? '📊 Show Standings' : '🏈 Show Scores'}</button>
                        <button id="refresh-scores-btn" type="button">↻ Refresh</button>
                    </div>
                </div>
                <div id="scoreboard-sections"></div>
            `;

            const sectionsEl = document.getElementById('scoreboard-sections');
            const updatedEl = container.querySelector('.scoreboard-updated');

            const shiftDay = (deltaDays) => {
                const nextDate = new Date(activeDate);
                nextDate.setDate(nextDate.getDate() + deltaDays);
                renderSportsScoreboard(container, 'scores', nextDate);
            };

            document.getElementById('prev-day-btn').onclick = () => shiftDay(-1);
            document.getElementById('next-day-btn').onclick = () => shiftDay(1);
            document.getElementById('today-date-btn').onclick = () => {
                renderSportsScoreboard(container, viewMode, getLocalDateStart());
            };
            document.getElementById('toggle-view-btn').onclick = () => {
                renderSportsScoreboard(container, viewMode === 'scores' ? 'standings' : 'scores', activeDate);
            };
            document.getElementById('refresh-scores-btn').onclick = () => {
                renderSportsScoreboard(container, viewMode, activeDate);
            };

            try {
                const results = await Promise.allSettled(
                    leagues.map(async (lg) => {
                        const url = viewMode === 'scores'
                            ? `https://site.api.espn.com/apis/site/v2/sports/${lg.sport}/${lg.league}/scoreboard?dates=${dateParam}`
                            : `https://site.api.espn.com/apis/site/v2/sports/${lg.sport}/${lg.league}/standings?level=3`;
                        const res = await fetch(url);
                        if (!res.ok) throw new Error(`HTTP ${res.status}`);
                        const data = await res.json();
                        return { name: lg.name, data, viewMode };
                    })
                );

                if (token !== scoreboardRenderToken) return;

                let html = '';

                results.forEach((result) => {
                    if (result.status !== 'fulfilled') return;
                    const { name, data, viewMode: mode } = result.value;

                    html += `<section class="scoreboard-league">`;
                    html += `<h2 class="scoreboard-league-title">${name}</h2>`;

                    if (mode === 'scores') {
                        const events = data.events || [];
                        if (!events.length) {
                            html += `<p class="scoreboard-empty">No games scheduled for ${dateLabelText}.</p></section>`;
                            return;
                        }
                        html += `<div class="scoreboard-grid">`;
                        events.forEach((ev) => {
                            const comp = ev.competitions?.at(0);
                            if (!comp) return;
                            const away = comp.competitors.find(c => c.homeAway === 'away');
                            const home = comp.competitors.find(c => c.homeAway === 'home');
                            if (!away || !home) return;

                            const statusType = comp.status?.type || ev.status?.type || {};
                            const state = statusType.state;
                            const statusText = statusType.shortDetail || statusType.detail || '';
                            const broadcast = comp.broadcast || comp.broadcasts?.at(0)?.names?.at(0) || '';

                            const gameLink = ev.links?.find(l => l.rel?.includes('summary'))?.href || '';
                            const hasLink = gameLink && gameLink !== '#';

                            const favoriteAbbrs = new Set(['NYG', 'NYK', 'NYR', 'NYY']);
                            const isFavGame = favoriteAbbrs.has(away.team?.abbreviation) || favoriteAbbrs.has(home.team?.abbreviation);

                            const renderTeamRow = (teamObj) => {
                                const abbr = teamObj.team?.abbreviation || '';
                                const teamName = teamObj.team?.shortDisplayName || teamObj.team?.displayName || abbr;
                                const logo = teamObj.team?.logo || '';
                                const record = teamObj.records?.at(0)?.summary || '';
                                const score = state === 'pre' ? '-' : (teamObj.score ?? '0');
                                const isWinner = state === 'post' && teamObj.winner;

                                return `
                                    <div class="sb-team-row ${isWinner ? 'sb-winner' : ''}">
                                        <div class="sb-team-info">
                                            ${logo ? `<img src="${logo}" alt="${abbr}" class="sb-team-logo" loading="lazy">` : ''}
                                            <span class="sb-team-name">${teamName}</span>
                                            ${record ? `<span class="sb-team-record">(${record})</span>` : ''}
                                        </div>
                                        <span class="sb-team-score">${score}</span>
                                    </div>
                                `;
                            };

                            const cardStyle = hasLink
                                ? 'cursor: pointer; transition: background-color 0.2s ease, border-color 0.2s ease;'
                                : 'opacity: 0.85; cursor: default;';

                            html += `
                                <div class="sb-card ${state === 'in' ? 'sb-live' : ''} ${isFavGame ? 'sb-favorite' : ''}" style="${cardStyle}" ${hasLink ? `data-gamelink="${gameLink}"` : ''}>
                                    <div class="sb-card-header">

                                        ${broadcast ? `<span class="sb-broadcast">${broadcast}</span>` : ''}
                                    </div>
                                    ${renderTeamRow(away)}
                                    ${renderTeamRow(home)}
                                </div>
                            `;
                        });
                        html += `</div>`;
                    } else {
                        const standingsGroups = data.standings || data.children || [];
                        if (!standingsGroups.length) {
                            html += `<p class="scoreboard-empty">Standings unavailable.</p></section>`;
                            return;
                        }

                        html += `<div style="display: flex; flex-direction: column; gap: 16px;">`;

                        standingsGroups.forEach((confNode) => {
                            const confName = confNode.name || 'Conference';
                            const confChildren = confNode.children || [];

                            html += `
                                <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; box-shadow: var(--shadow-sm);">
                                    <div style="font-size: 1.1em; font-weight: 700; color: var(--accent-title); margin-bottom: 14px; padding-bottom: 6px; border-bottom: 2px solid var(--border-color); letter-spacing: 0.04em;">${confName}</div>
                                    <div class="scoreboard-grid" style="margin-bottom: 0;">
                            `;

                            const renderDivisions = (node) => {
                                const entries = node.standings?.entries || node.entries || [];
                                const subGroups = node.children || [];

                                if (entries.length > 0) {
                                    const sortedEntries = [...entries].sort((a, b) => {
                                        const getStatVal = (statsList, statName) => {
                                            const s = statsList.find(st => st.name === statName);
                                            return s ? parseFloat(s.value) : 0;
                                        };
                                        const wpA = getStatVal(a.stats || [], 'winPercent');
                                        const wpB = getStatVal(b.stats || [], 'winPercent');
                                        if (wpA !== wpB) return wpB - wpA;

                                        const wA = getStatVal(a.stats || [], 'wins');
                                        const wB = getStatVal(b.stats || [], 'wins');
                                        return wB - wA;
                                    });

                                    const divName = node.name || 'Division';
                                    html += `
                                        <div class="sb-card" style="padding: 14px; margin-bottom: 0; background: var(--bg-body);">
                                            <div style="font-size: 0.9em; font-weight: 700; color: var(--accent-primary); margin-bottom: 10px; padding-bottom: 4px; border-bottom: 1px solid var(--border-color);">${divName}</div>
                                            <div style="display: flex; flex-direction: column; gap: 6px;">
                                    `;

                                    sortedEntries.forEach((entry) => {
                                        const teamName = entry.team?.displayName || entry.team?.shortDisplayName || '';
                                        const logo = entry.team?.logo || '';
                                        const stats = entry.stats || [];
                                        const getStat = (stName) => stats.find(s => s.name === stName)?.displayValue || '';
                                        const record = getStat('overall') || `${getStat('wins')}-${getStat('losses')}`;

                                        html += `
                                            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.9em; padding: 3px 0; color: var(--text-secondary);">

                                                    <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-primary);">${teamName}</span>
                                                </div>
                                                <span style="font-variant-numeric: tabular-nums; font-weight: 600; margin-left: 12px; flex-shrink: 0;">${record}</span>
                                            </div>
                                        `;
                                    });

                                    html += `</div></div>`;
                                }

                                subGroups.forEach(sub => renderDivisions(sub));
                            };

                            if (confChildren.length > 0) {
                                confChildren.forEach(child => renderDivisions(child));
                            } else {
                                renderDivisions(confNode);
                            }

                            html += `</div></div>`;
                        });

                        html += `</div>`;
                    }

                    html += `</section>`;
                });

                sectionsEl.innerHTML = html;

                sectionsEl.querySelectorAll('.sb-card[data-gamelink]').forEach(card => {

            } catch (err) {

            }

        async function fetchFeed(url, title, activeLink) {
            currentFetchUrl = url;
            currentFeedTitle = title || 'Bobs Stuff';
            exitArticleView();

            const inputGroup = document.querySelector('.input-group');
            let loadingIcon = null;
            updateFavoriteIconsState(url);
            const iconId = activeLink ? `loading-icon-${encodeURIComponent(url)}` : null;

            // Look up per-source settings (openArticlesInNewTab & defaultReaderMode)
            const cleanLookupUrl = (url || '').replace(/#scrape$/, '');
            let matchedLink = null;
            for (const section of loadedConfig) {
                matchedLink = section.links.find(
                    l => (l.feed || l.href || '').replace(/#scrape$/, '') === cleanLookupUrl
                );
                if (matchedLink) break;
            }
            currentOpenInNewTab = !!(matchedLink && (matchedLink.openArticlesInNewTab || matchedLink.target));
            currentDefaultReaderMode = !!(matchedLink && matchedLink.defaultReaderMode);

            errorContainer.style.display = 'none';
            if (url && url.endsWith('.html')) {
                feedTitle.textContent = title;
                inputGroup.style.display = 'none';
                renderIframe(feedContainer, url);
                return;
            }
            if (url === 'scoreboard://all') {
                feedTitle.textContent = title || 'Sports Scores';
                inputGroup.style.display = 'none';
                renderSportsScoreboard(feedContainer);
                return;
            }

            inputGroup.style.display = 'flex';

            if (iconId) {
                const existingIcon = document.getElementById(iconId);
                if (existingIcon) existingIcon.remove();
            }
            feedTitle.textContent = title || 'Loading...';
            renderPlaceholders(feedContainer);

            if (activeLink) {
                loadingIcon = document.createElement('div');
                loadingIcon.className = 'loading-icon';
                loadingIcon.id = iconId;
                loadingIcon.style.display = 'inline-block';
                activeLink.parentElement.appendChild(loadingIcon);
            }

            if (!url) {
                errorContainer.innerHTML = 'The requested feed is not available.';
                errorContainer.style.display = 'block';
                if (loadingIcon) loadingIcon.remove();
                feedTitle.textContent = title || 'Bobs Stuff';
                feedContainer.innerHTML = '';
                return;
            }

            const cachedItems = getCache(url);
            if (cachedItems && cachedItems.length > 0) {
                feedTitle.textContent = title;
                renderFeedItems(cachedItems, feedContainer, currentOpenInNewTab);
                scrollToTop();
                if (loadingIcon) loadingIcon.remove();
                return;
            }

            try {
                const items = await _fetchAndParseFeed(url);
                setCache(url, items);
                prefetchedFeeds.add(url);

                // Race-condition guard: stop if the user clicked another feed while waiting
                if (currentFetchUrl !== url) return;

                feedTitle.textContent = title;
                renderFeedItems(items, feedContainer, currentOpenInNewTab);
                scrollToTop();
                if (activeLink) activeLink.classList.remove('disabled');
            } catch (error) {
                if (currentFetchUrl !== url) return;

                console.error(`Fetch failed for ${url}:`, error);
                const isRssFile = /rss|feed|xml|atom|rdf|#scrape/i.test(url) || url.includes('/rss');
                if (isRssFile) {
                    const cleanUrl = url.replace(/#scrape$/, '');
                    errorContainer.innerHTML = `<b>Feed Error:</b> ${error.message} <br><br><a href="${cleanUrl}" target="_blank">Open Directly</a> | <button onclick="fetchFeed('${url}', '${title}', null)">Retry</button>`;
                    errorContainer.style.display = 'block';
                    feedContainer.innerHTML = '';
                } else {
                    renderIframe(feedContainer, url);
                }
            } finally {
                if (loadingIcon) loadingIcon.remove();
            }
        }

        function showToast(message, durationMs = 4000) {
            const existing = document.getElementById('app-toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.id = 'app-toast';
            toast.textContent = message;

            Object.assign(toast.style, {
                position: 'fixed',
                bottom: '24px',
                right: '24px',
                zIndex: '99999',
                backgroundColor: 'var(--bg-card, #282c34)',
                color: 'var(--accent-title, #f5c542)',
                border: '2px solid var(--accent-primary, #4dabf7)',
                padding: '14px 20px',
                borderRadius: '8px',
                boxShadow: '0 8px 24px rgba(0, 0, 0, 0.6)',
                fontSize: '0.95em',
                fontWeight: '600',
                opacity: '0',
                transform: 'translateY(12px)',
                transition: 'opacity 0.25s ease, transform 0.25s ease',
                pointerEvents: 'none'
            });

            document.body.appendChild(toast);

            // Force browser reflow so the fade-in animation always runs
            void toast.offsetWidth;

            toast.style.opacity = '1';
            toast.style.transform = 'translateY(0)';

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(12px)';
                setTimeout(() => toast.remove(), 300);
            }, durationMs);
        }

        async function loadReaderMode(articleUrl, fallbackTitle, onFallback = null) {
            const readerBtn = document.getElementById('reader-view-btn');
            if (readerBtn) {
                readerBtn.disabled = true;
                readerBtn.textContent = 'Loading Reader...';
            }

            feedContainer.innerHTML = `<div class="reader-article"><p>Extracting article text...</p></div>`;
            scrollToTop();

            try {
                const res = await fetch(`/.netlify/functions/read-article?url=${encodeURIComponent(articleUrl)}`);
                const data = await res.json();

                if (!res.ok || data.error) {
                    throw new Error(data.details || data.error || 'Could not extract article text.');
                }

                if (!data.paragraphs || data.paragraphs.length === 0) {
                    throw new Error('No readable paragraphs found on this page.');
                }

                const imgHtml = data.image
                    ? `<img class="reader-hero-img" src="${data.image}" alt="" onerror="this.remove()">`
                    : '';

                const paragraphsHtml = data.paragraphs
                    .map(p => `<p>${stripHTML(p)}</p>`)
                    .join('');

                feedContainer.innerHTML = `
                    <article class="reader-article">
                        <div class="reader-meta">${stripHTML(data.siteName || '')}</div>
                        <h1>${stripHTML(data.title || fallbackTitle)}</h1>
                        ${imgHtml}
                        <div class="reader-body">${paragraphsHtml}</div>
                    </article>
                `;
                scrollToTop();

                if (readerBtn) {
                    readerBtn.disabled = false;
                    readerBtn.textContent = '🌐 Web View';
                }
            } catch (err) {
                console.warn('Reader Mode unavailable, falling back to Web View:', err.message);
                if (readerBtn) {
                    readerBtn.disabled = false;
                }

                // Automatically switch to Web View (iframe) without showing an error
                if (typeof onFallback === 'function') {
                    showToast('The article could not be rendered in reader mode - switching to web mode');
                    onFallback();
                    return;
                }

                feedContainer.innerHTML = `
                    <div class="reader-article">
                        <h2>Reader Mode Unavailable</h2>
                        <p>${err.message}</p>
                        <p><a href="${articleUrl}" target="_blank" rel="noopener" style="color: var(--accent-primary);">Open Original Article in New Tab ↗</a></p>
                    </div>
                `;
            }
        }

                    <iframe src="${articleUrl}" style="width: 100%; height: calc(100vh - 135px); border: none; border-radius: 8px; background: #fff;"></iframe>

            // 2. Wire up sticky right-panel header buttons

                    exitArticleView();
                    feedTitle.textContent = labelTitle;
                    renderFeedItems(currentFeedItems, feedContainer, currentOpenInNewTab);
                    scrollToTop();
                };
            }

            if (readerBtn) {
                readerBtn.textContent = isReaderMode ? '🌐 Web View' : '📖 Reader View';
                readerBtn.onclick = () => {
                    if (!isReaderMode) {
                        isReaderMode = true;
                        loadReaderMode(articleUrl, articleTitle, showIframe);
                    } else {
                        showIframe();
                    }
                };
            }

            if (originalLink) {
                originalLink.href = articleUrl;
            }
            if (articleHeader) {
                articleHeader.style.display = 'flex';
            }

            // 3. Load initial view for this source
            if (isReaderMode) {
                loadReaderMode(articleUrl, articleTitle, showIframe);
            } else {
                showIframe();
            }
        }

        async function initializePage() {
            const urlParams = new URLSearchParams(window.location.search);
            const view = urlParams.get('view');
            const configFile = view === 'priv' ? 'private-links.json' : 'public-links.json';
            const inputGroup = document.querySelector('.input-group');

            try {
                function loadJSON(filePath) {
                    return new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.overrideMimeType("application/json");
                        xhr.open('GET', filePath, true);
                        xhr.onload = function () {
                            if (xhr.status === 200) {
                                resolve(JSON.parse(xhr.responseText));
                            } else {
                                reject(`Could not load ${filePath}: ${xhr.status} ${xhr.statusText}`);
                            }
                        };
                        xhr.onerror = function () {
                            reject(`Could not load ${filePath}: Network error`);
                        };
                        xhr.send();
                    });
                }

                // Load the configuration file
                const sections = await loadJSON(configFile);
                loadedConfig = sections;
                buildSidebar(sections);

                // ---> UPDATED BLOCK STARTS HERE <---
                // Initialize with the first available feed
                const firstFeedLink = document.querySelector('.sidebar a[data-feed]');
                if (firstFeedLink) {

                    const feedTitle = firstFeedLink.getAttribute('data-title');

                    firstFeedLink.classList.add('active');
                    fetchFeed(feedUrl, feedTitle, firstFeedLink);

                // Start pre-fetching all OTHER feeds after sidebar is built
                prefetchAllFeeds(false);

                // If in private view, show the favorite management icons
                if (view === 'priv') {
                    document.getElementById('add-to-favorites').style.display = 'block';
                    document.getElementById('edit-from-favorites').style.display = 'block';
                    document.getElementById('delete-from-favorites').style.display = 'block';

                    document.getElementById('sync-server-btn').style.display = 'block';
                    setupFavoritesHandler();
                }
                inputGroup.style.display = 'flex';

            } catch (error) {
                console.error("Failed to initialize page:", error);
                const urlParams = new URLSearchParams(window.location.search);
                const view = urlParams.get('view');
                if (view !== 'priv') {
                    document.getElementById('add-to-favorites').style.display = 'none';
                    document.getElementById('edit-from-favorites').style.display = 'none';
                    document.getElementById('delete-from-favorites').style.display = 'none';

                document.getElementById('error').style.display = 'block';
            }
        }

        function buildSidebar(sections, newlyAddedUrl = null) {
            const sidebarContent = document.getElementById('sidebar-content');
            sidebarContent.innerHTML = ''; // Clear any existing content
            let allFeeds = [];


            sections.forEach(section => {
                const sectionHeader = document.createElement('div');
                sectionHeader.className = 'sidebar-section-header';
                sectionHeader.innerHTML = `<hr><span>${section.title}</span>`;
                sidebarContent.appendChild(sectionHeader);

                const ul = document.createElement('ul');
                ul.setAttribute('role', 'navigation');
                ul.setAttribute('aria-label', section.title);

                section.links.forEach(link => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = link.href || '#';
                    a.textContent = link.title;
                    if (link.feed) {
                        a.setAttribute('data-feed', link.feed);
                        a.setAttribute('data-title', link.title);
                        // Only disable actual RSS feeds, not local HTML pages
                        // Also, don't disable feeds that have already been successfully prefetched
                        if (link.feed !== newlyAddedUrl && !link.feed.endsWith('.html') && !prefetchedFeeds.has(link.feed)) {
                            a.classList.add('disabled');
                        }
                        if (!link.feed.endsWith('.html')) {
                            allFeeds.push(link.feed);
                        }
                    }

                    if (link.target) a.target = link.target;
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                sidebarContent.appendChild(ul);
            });
            const lastUl = sidebarContent.querySelector('ul:last-of-type');
            if (lastUl) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#';
                a.textContent = 'Sports Scores';
                a.setAttribute('data-feed', 'scoreboard://all');
                a.setAttribute('data-title', 'Sports Scores');
                li.appendChild(a);
                lastUl.appendChild(li);
            }
            CRITICAL_FEEDS = allFeeds; // All feeds are now considered critical for prefetching
        }

            const hrefUrl = link.getAttribute('href');
            const feedTitle = link.getAttribute('data-title');
            const managementUrl = feedUrl || (hrefUrl && hrefUrl !== '#' ? hrefUrl : null);

            if (!managementUrl) return;

            // External links (no data-feed) never load into the right panel:
            // keep the current right-panel item's .active highlight intact,
            // blur the clicked link immediately, and populate the URL bar so
            // Private View edit/delete toolbar buttons can target it.
            if (!feedUrl) {
                rssInput.value = managementUrl;
                updateFavoriteIconsState(managementUrl);
                link.blur();
                return;
            }

            document.querySelectorAll('.sidebar a').forEach(l => l.classList.remove('active'));
            link.classList.add('active');
            rssInput.value = managementUrl;
            updateFavoriteIconsState(managementUrl);

            e.preventDefault();
            if (link.classList.contains('disabled')) {
                errorContainer.innerHTML = `This feed is still loading. Please wait or <button onclick="fetchFeed('${feedUrl}', '${feedTitle}', null)">try now</button>.`;
                errorContainer.style.display = 'block';
                return;
            }
            fetchFeed(feedUrl, feedTitle, link);

            if (window.innerWidth <= 600) {
                const sidebar = document.querySelector('.sidebar');
                const sidebarOverlay = document.querySelector('.sidebar-overlay');
                const headerControls = document.querySelector('.header-controls');
                sidebar.classList.add('sidebar-hidden');
                sidebarOverlay.classList.remove('active');
                headerControls.appendChild(toggleModeButton);
                headerControls.appendChild(refreshFeedsButton);
                headerControls.appendChild(toggleSidebarButton);
                toggleSidebarButton.title = 'Show Sidebar';
                toggleSidebarButton.setAttribute('aria-label', 'Show sidebar');
                localStorage.setItem('sidebarState', 'hidden');
            }
        }

        function updateFavoriteIconsState(currentUrl) {
            const heartButton = document.getElementById('add-to-favorites');
            const deleteButton = document.getElementById('delete-from-favorites');
            const editButton = document.getElementById('edit-from-favorites');
            if (!heartButton || heartButton.style.display === 'none') return; // Both icons are managed together

            // Check if the URL is already in our loaded configuration
            let isFavorite = false;
            if (currentUrl) {
                isFavorite = loadedConfig.some(section =>
                    section.links.some(link => link.feed === currentUrl || link.href === currentUrl)
                );
            }

            // The heart (add) button is enabled if it's NOT a favorite
            // Also disable if the URL is empty (e.g., on initial load with no selection)
            heartButton.disabled = isFavorite || !currentUrl;
            heartButton.title = isFavorite ? 'Already in Favorites' : 'Add to Favorites';

            // The delete button is enabled if it IS a favorite
            deleteButton.disabled = !isFavorite;
            deleteButton.title = isFavorite ? 'Delete from Favorites' : 'Not in Favorites';

            // The edit button is also enabled if it IS a favorite
            editButton.disabled = !isFavorite;
            editButton.title = isFavorite ? 'Edit Favorite' : 'Not in Favorites';
        }

        //##############################################################################

        function setupFavoritesHandler() {
            initAddFavoriteModal();
            initEditFavoriteModal();
            initDeleteFavorite();
            initExportAndSyncButtons();
        }

        function initExportAndSyncButtons() {
            const exportBtn = document.getElementById('export-favorites-btn');
            const syncBtn = document.getElementById('sync-server-btn');

            exportBtn?.addEventListener('click', () => {
                downloadJson(loadedConfig, 'private-links.json');
                const savedPublic = localStorage.getItem(getConfigStorageKey(false));
                if (savedPublic) {
                    downloadJson(JSON.parse(savedPublic), 'public-links.json');
                }
                showToast('Exported JSON file(s) to your Downloads folder.');
            });

            syncBtn?.addEventListener('click', () => {
                if (window.confirm('Discard local browser changes and reload the latest links from the server?')) {
                    localStorage.removeItem(getConfigStorageKey(true));
                    localStorage.removeItem(getConfigStorageKey(false));
                    location.reload();
                }
            });
        }

        function initAddFavoriteModal() {
            const heartButton = document.getElementById('add-to-favorites');
            const modal = document.getElementById('add-feed-modal');
            const modalCancel = document.getElementById('modal-cancel-btn');
            const modalSave = document.getElementById('modal-save-btn');
            const newFeedTitleInput = document.getElementById('new-feed-title');
            const privateOnlyCheckbox = document.getElementById('private-only-checkbox');
            const newTabCheckbox = document.getElementById('new-tab-checkbox');
            const scrapeCheckbox = document.getElementById('scrape-page-checkbox');
            const defaultReaderCheckbox = document.getElementById('default-reader-checkbox');
            const newFeedSectionSelect = document.getElementById('new-feed-section');

            newTabCheckbox?.addEventListener('change', () => {
                if (newTabCheckbox.checked) {
                    if (scrapeCheckbox) scrapeCheckbox.checked = false;
                    if (defaultReaderCheckbox) defaultReaderCheckbox.checked = false;
                }
            });

            heartButton.addEventListener('click', () => {
                if (heartButton.disabled) return;

                newFeedSectionSelect.innerHTML = '';
                loadedConfig.forEach(section => {
                    const option = document.createElement('option');
                    option.value = section.title;
                    option.textContent = section.title;
                    newFeedSectionSelect.appendChild(option);
                });

                if (scrapeCheckbox) {
                    scrapeCheckbox.checked = rssInput.value.trim().endsWith('#scrape');
                }
                if (defaultReaderCheckbox) {
                    defaultReaderCheckbox.checked = false;
                }

                modal.style.display = 'flex';
                newFeedTitleInput.focus();
            });

            modalCancel.addEventListener('click', () => {
                modal.style.display = 'none';
                newFeedTitleInput.value = '';
                newTabCheckbox.checked = false;
                if (scrapeCheckbox) scrapeCheckbox.checked = false;
                if (defaultReaderCheckbox) defaultReaderCheckbox.checked = false;
            });

            modalSave.addEventListener('click', async () => {
                const newTitle = newFeedTitleInput.value.trim();
                const selectedSectionTitle = newFeedSectionSelect.value;
                const openArticlesInNewTab = newTabCheckbox.checked;
                const defaultReaderMode = !!(defaultReaderCheckbox && defaultReaderCheckbox.checked && !openArticlesInNewTab);
                let newUrl = normalizeUrl(rssInput.value.trim().replace(/#scrape$/, ''));

                if (!newTitle || !newUrl || !selectedSectionTitle) {
                    alert('Please provide a title and select a section.');
                    return;
                }

                if (scrapeCheckbox && scrapeCheckbox.checked && !openArticlesInNewTab) {
                    newUrl += '#scrape';
                }

                const isLocalPage = newUrl.endsWith('.html');
                const newLinkObject = isLocalPage
                    ? { href: newUrl, title: newTitle, ...(openArticlesInNewTab ? { target: '_blank' } : {}) }
                    : { feed: newUrl, title: newTitle, openArticlesInNewTab, defaultReaderMode };

                const targetSection = loadedConfig.find(s => s.title === selectedSectionTitle);
                if (targetSection) {
                    targetSection.links.push(newLinkObject);
                } else {
                    alert('Could not find the selected section. Please try again.');
                    return;
                }

                // Save immediately to browser localStorage (no automatic file download)
                savePrivateConfigLocal(loadedConfig);

                if (!privateOnlyCheckbox.checked) {
                    try {
                        const publicConfig = await getPublicConfig();
                        const publicTargetSection = publicConfig.find(s => s.title === selectedSectionTitle);
                        if (publicTargetSection) {
                            publicTargetSection.links.push(newLinkObject);
                            savePublicConfigLocal(publicConfig);
                        }
                    } catch (error) {
                        console.error('Could not update local public config:', error);
                    }
                }

                modal.style.display = 'none';
                newFeedTitleInput.value = '';
                newTabCheckbox.checked = false;
                if (scrapeCheckbox) scrapeCheckbox.checked = false;
                if (defaultReaderCheckbox) defaultReaderCheckbox.checked = false;

                rssInput.value = newUrl;
                buildSidebar(loadedConfig, newUrl);
                updateFavoriteIconsState(newUrl);
                showToast(`Added "${newTitle}" to Favorites.`);
            });
        }

        //###

        function initEditFavoriteModal() {
            const editButton = document.getElementById('edit-from-favorites');
            const editModal = document.getElementById('edit-feed-modal');
            const editModalCancel = document.getElementById('edit-modal-cancel-btn');
            const editModalSave = document.getElementById('edit-modal-save-btn');
            const editFeedTitleInput = document.getElementById('edit-feed-title');
            const editFeedUrlInput = document.getElementById('edit-feed-url');
            const editFeedSectionSelect = document.getElementById('edit-feed-section');
            const editPrivateOnlyCheckbox = document.getElementById('edit-private-only-checkbox');
            const editNewTabCheckbox = document.getElementById('edit-new-tab-checkbox');
            const editScrapeCheckbox = document.getElementById('edit-scrape-page-checkbox');
            const editDefaultReaderCheckbox = document.getElementById('edit-default-reader-checkbox');

            let originalUrlToEdit = null;
            let linkToEdit = null;

            editNewTabCheckbox?.addEventListener('change', () => {
                if (editNewTabCheckbox.checked) {
                    if (editDefaultReaderCheckbox) editDefaultReaderCheckbox.checked = false;
                }
            });

            editButton.addEventListener('click', async () => {
                if (editButton.disabled) return;

                const cleanInputUrl = rssInput.value.trim().replace(/#scrape$/, '');
                if (!cleanInputUrl) return;

                linkToEdit = null;
                let sectionOfLink = null;

                for (const section of loadedConfig) {
                    const foundLink = section.links.find(link => {
                        const saved = (link.feed || link.href || '').replace(/#scrape$/, '');
                        return saved === cleanInputUrl;
                    });
                    if (foundLink) {
                        linkToEdit = foundLink;
                        sectionOfLink = section;
                        originalUrlToEdit = foundLink.feed || foundLink.href;
                        break;
                    }
                }

                if (!linkToEdit) {
                    alert('Could not find the selected link to edit.');
                    return;
                }

                const rawSavedUrl = linkToEdit.feed || linkToEdit.href || '';
                const hasScrapeFlag = rawSavedUrl.includes('#scrape');

                editFeedTitleInput.value = linkToEdit.title;
                editFeedUrlInput.value = rawSavedUrl.replace(/#scrape$/, '');
                editNewTabCheckbox.checked = !!(linkToEdit.openArticlesInNewTab || linkToEdit.target);
                if (editScrapeCheckbox) {
                    editScrapeCheckbox.checked = hasScrapeFlag;
                }
                if (editDefaultReaderCheckbox) {
                    editDefaultReaderCheckbox.checked = !!linkToEdit.defaultReaderMode;
                }

                editFeedSectionSelect.innerHTML = '';
                loadedConfig.forEach(section => {
                    const option = document.createElement('option');
                    option.value = section.title;
                    option.textContent = section.title;
                    editFeedSectionSelect.appendChild(option);
                });
                editFeedSectionSelect.value = sectionOfLink.title;

                try {
                    const publicConfig = await getPublicConfig();
                    const isInPublic = publicConfig.some(section =>
                        section.links.some(link => {
                            const savedPublic = (link.feed || link.href || '').replace(/#scrape$/, '');
                            return savedPublic === cleanInputUrl;
                        })
                    );
                    editPrivateOnlyCheckbox.checked = !isInPublic;
                } catch (error) {
                    editPrivateOnlyCheckbox.checked = true;
                }

                editModal.style.display = 'flex';
            });

            editModalCancel.addEventListener('click', () => {
                editModal.style.display = 'none';
                originalUrlToEdit = null;
                linkToEdit = null;
            });

            editModalSave.addEventListener('click', async () => {
                if (!originalUrlToEdit) return;

                const newTitle = editFeedTitleInput.value.trim();
                const newSectionTitle = editFeedSectionSelect.value;
                const openArticlesInNewTab = editNewTabCheckbox.checked;
                const defaultReaderMode = !!(editDefaultReaderCheckbox && editDefaultReaderCheckbox.checked && !openArticlesInNewTab);
                let newUrl = normalizeUrl(editFeedUrlInput.value.trim().replace(/#scrape$/, ''));

                if (!newTitle || !newUrl || !newSectionTitle) {
                    alert('Please provide a title, URL, and section.');
                    return;
                }

                if (editScrapeCheckbox && editScrapeCheckbox.checked) {
                    newUrl += '#scrape';
                }

                const cleanOriginal = originalUrlToEdit.replace(/#scrape$/, '');
                loadedConfig.forEach(section => {
                    section.links = section.links.filter(link => {
                        const saved = (link.feed || link.href || '').replace(/#scrape$/, '');
                        return saved !== cleanOriginal;
                    });
                });

                const wasHrefLink = !!(linkToEdit && linkToEdit.href && !linkToEdit.feed);
                const isLocalPage = newUrl.endsWith('.html');
                const newLinkObject = (isLocalPage || wasHrefLink)
                    ? { href: newUrl, title: newTitle, ...(openArticlesInNewTab ? { target: '_blank' } : {}) }
                    : { feed: newUrl, title: newTitle, openArticlesInNewTab, defaultReaderMode };

                const newSection = loadedConfig.find(s => s.title === newSectionTitle);
                if (newSection) {
                    newSection.links.push(newLinkObject);
                }

                savePrivateConfigLocal(loadedConfig);

                try {
                    const publicConfig = await getPublicConfig();
                    publicConfig.forEach(section => {
                        section.links = section.links.filter(link => {
                            const saved = (link.feed || link.href || '').replace(/#scrape$/, '');
                            return saved !== cleanOriginal;
                        });
                    });

                    if (!editPrivateOnlyCheckbox.checked) {
                        const publicTargetSection = publicConfig.find(s => s.title === newSectionTitle);
                        if (publicTargetSection) publicTargetSection.links.push(newLinkObject);
                    }

                    savePublicConfigLocal(publicConfig);
                } catch (error) {
                    console.error('Could not update local public config:', error);
                }

                currentOpenInNewTab = openArticlesInNewTab;
                currentDefaultReaderMode = defaultReaderMode;

                editModal.style.display = 'none';
                originalUrlToEdit = null;
                linkToEdit = null;
                buildSidebar(loadedConfig, newUrl);
                rssInput.value = newUrl;
                updateFavoriteIconsState(newUrl);
                showToast(`Updated "${newTitle}".`);
            });
        }

        //######

        function initDeleteFavorite() {
            const deleteButton = document.getElementById('delete-from-favorites');
            deleteButton.addEventListener('click', async () => {
                if (deleteButton.disabled) return;

                const urlToDelete = rssInput.value.trim();
                if (!urlToDelete) return;

                if (window.confirm('Are you sure you want to remove this feed from your favorites?')) {
                    let linkRemoved = false;
                    const cleanTarget = urlToDelete.replace(/#scrape$/, '');

                    loadedConfig.forEach(section => {
                        const initialLinkCount = section.links.length;
                        section.links = section.links.filter(link => {
                            const saved = (link.feed || link.href || '').replace(/#scrape$/, '');
                            return saved !== cleanTarget;
                        });
                        if (section.links.length < initialLinkCount) {
                            linkRemoved = true;
                        }
                    });

                    if (linkRemoved) {
                        savePrivateConfigLocal(loadedConfig);
                        try {
                            const publicConfig = await getPublicConfig();
                            publicConfig.forEach(section => {
                                section.links = section.links.filter(link => {
                                    const saved = (link.feed || link.href || '').replace(/#scrape$/, '');
                                    return saved !== cleanTarget;
                                });
                            });
                            savePublicConfigLocal(publicConfig);
                        } catch (e) {}

                        buildSidebar(loadedConfig);
                        updateFavoriteIconsState(urlToDelete);
                        showToast('Favorite removed.');
                    }
                }
            });
        }


        //##############################################################################

        // Set dynamic version date in footer
        (function setVersionDate() {
            const versionElement = document.getElementById('version-date');
            if (versionElement) {
                versionElement.textContent = APP_VERSION;
            }
        })();

        // Expose necessary functions to window for dynamic HTML calls
        window.fetchFeed = fetchFeed;

        // Start the application
        document.addEventListener('DOMContentLoaded', initializePage);
    })();
    </script>
