<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a1a">
    <title>Bobs Stuff</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar-overlay"></div>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>Bob's Stuff</h1>
                <div class="header-buttons">
                    <button class="toggle-mode" title="Toggle Light/Dark Mode" aria-label="Toggle light or dark mode">🌙</button>
                    <button class="refresh-feeds" title="Refresh All Feeds" aria-label="Refresh all feeds">♻️</button>
                    <button class="toggle-sidebar" title="Hide Sidebar" aria-label="Hide sidebar">☰</button>
                </div>
            </div>
            <!-- Article Reading Controls (shown only when viewing an article) -->
            <div id="sidebar-article-controls" style="display: none;">
                <button id="back-to-feed-btn" type="button">← Back to Feed</button>
                <a id="open-original-link" href="#" target="_blank" rel="noopener">Open Original Page ↗</a>
            </div>
            <img src="illusionUP1.png" alt="Illusion Image" class="sidebar-image" style="display: none;">
            <!-- Sidebar content will be dynamically inserted here -->
            <div id="sidebar-content"></div>
        </div>
        <div class="main-content">
            <div class="header-controls">
                <!-- Toggle buttons will be appended here dynamically if needed -->
            </div>
            <h1 id="feed-title">Bobs Stuff</h1>
            <div class="input-group">
                <input type="text" id="rssUrl" placeholder="Enter RSS feed URL (e.g., https://example.com/feed.xml)">
                <button id="load-feed-btn" type="button">Load Feed</button>
                <button id="add-to-favorites" title="Add to Favorites" disabled>❤️</button>
                <button id="edit-from-favorites" title="Edit Favorite" disabled>✏️</button>
                <button id="delete-from-favorites" title="Delete from Favorites" disabled>🗑️</button>
            </div>
            <div id="error"></div>
            <div id="feed"></div>
        </div>
    </div>

    <!-- Modal for adding a new feed -->
    <div id="add-feed-modal" class="modal-overlay">
        <div class="modal">
            <h2>Add to Favorites</h2>
            <p>Enter a title for this new feed.</p>
            <input type="text" id="new-feed-title" placeholder="e.g., My Favorite Blog">
            <p>Select a section to add it to.</p>
            <select id="new-feed-section" class="modal-input" style="width: 100%; margin-bottom: 16px; padding: 8px;"></select>
            <div style="margin-top: 16px; margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="private-only-checkbox" checked style="width: auto; margin-right: 8px;">
                <label for="private-only-checkbox">Private Only</label>
            </div>
            <div style="margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="new-tab-checkbox" style="width: auto; margin-right: 8px;">
                <label for="new-tab-checkbox">Open in new tab</label>
            </div>
            <div style="margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="scrape-page-checkbox" style="width: auto; margin-right: 8px;">
                <label for="scrape-page-checkbox">Scrape stories from web page (non-RSS)</label>
            </div>
            <div class="modal-buttons">
                <button id="modal-cancel-btn">Cancel</button>
                <button id="modal-save-btn">Save</button>
            </div>
        </div>
    </div>

    <!-- Modal for editing an existing feed -->
    <div id="edit-feed-modal" class="modal-overlay">
        <div class="modal">
            <h2>Edit Favorite</h2>
            <p>Title</p>
            <input type="text" id="edit-feed-title">
            <p>URL</p>
            <input type="text" id="edit-feed-url">
            <p>Section</p>
            <select id="edit-feed-section" class="modal-input" style="width: 100%; margin-bottom: 16px; padding: 8px;"></select>
            <div style="margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="edit-private-only-checkbox" style="width: auto; margin-right: 8px;">
                <label for="edit-private-only-checkbox">Private Only</label>
            </div>
            <div style="margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="edit-new-tab-checkbox" style="width: auto; margin-right: 8px;">
                <label for="edit-new-tab-checkbox">Open in new tab</label>
            </div>
            <div style="margin-bottom: 16px; display: flex; align-items: center;">
                <input type="checkbox" id="scrape-page-checkbox" style="width: auto; margin-right: 8px;">
                <label for="scrape-page-checkbox">Scrape stories from web page (non-RSS)</label>
            </div>
            <div class="modal-buttons">
                <button id="edit-modal-cancel-btn">Cancel</button>
                <button id="edit-modal-save-btn">Save</button>
            </div>
        </div>
    </div>

    <footer>
        Coded by Bob Dolan and Google Gemini - Version <span id="version-date"></span>
    </footer>

    <script type="module">
    import { stripHTML, sanitizeDescription, getCache, setCache, clearCache, downloadJson, shuffleArray, showMessage, debounce } from './utils.js';

    (function() {
        // --- APPLICATION VERSION ---
        const APP_VERSION = "11142026";

        // --- STATE MANAGEMENT ---
        let prefetchedFeeds = new Set();
        let loadedConfig = [];
        let CRITICAL_FEEDS = [];
        
        // Elements
        const rssInput = document.getElementById('rssUrl');
        const feedContainer = document.getElementById('feed');
        const errorContainer = document.getElementById('error');
        const feedTitle = document.getElementById('feed-title');

        // Tracker for active fetch request to prevent race conditions
        let currentFetchUrl = null;

        const MAX_RETRY_ATTEMPTS = 2;
        const INITIAL_RETRY_DELAY_MS = 1000;

        function formatHumanDate(rawDate) {
            if (!rawDate || rawDate === 'No date') return 'Date unavailable';
            const parsed = new Date(rawDate);
            if (isNaN(parsed.getTime())) return rawDate;

            const now = new Date();
            const diffMs = now - parsed;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);

            if (diffMins >= 0 && diffMins < 60) {
                return diffMins <= 1 ? 'Just now' : `${diffMins} minutes ago`;
            }
            if (diffHours >= 0 && diffHours < 24 && now.getDate() === parsed.getDate()) {
                return `Today at ${parsed.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            }

            const yesterday = new Date(now);
            yesterday.setDate(now.getDate() - 1);
            if (yesterday.toDateString() === parsed.toDateString()) {
                return `Yesterday at ${parsed.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
            }

            return parsed.toLocaleDateString(undefined, {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: 'numeric',
                minute: '2-digit'
            });
        }

        /**
         * Internal helper to fetch and parse RSS/XML from the proxy.
         * Handles retries, proxy errors, and browser-side DOMParser fallback.
         */
        async function _fetchAndParseFeed(url, attempt = 1) {
            // Call your new Netlify Function endpoint
            const isScrape = url.endsWith('#scrape');
            const endpoint = isScrape ? '/.netlify/functions/scrape-page' : '/.netlify/functions/rss-proxy';
            const apiUrl = `${endpoint}?url=${encodeURIComponent(url)}`;
            try {
                const response = await fetch(apiUrl);

                if (!response.ok) {
                    let errorMsg = `HTTP Error ${response.status}: ${response.statusText}`;
                    try {
                        const errorData = await response.json();
                        if (errorData && (errorData.details || errorData.error)) {
                            errorMsg = `${errorData.error || 'Proxy Error'}: ${errorData.details || ''}`;
                        }
                    } catch (e) { /* Not JSON */ }

                    if (response.status === 422) {
                        throw new Error(`The proxy service is being blocked by ${new URL(url).hostname}. This often happens with major sites like ESPN or NYT.`);
                    }
                    if (response.status === 429) {
                        throw new Error(`Rate limit exceeded (429). The proxy service or the source site is throttling requests. Please wait a minute before refreshing again.`);
                    }
                    if (response.status === 404) {
                        throw new Error(`Proxy function not found (404). If testing locally, ensure you are using 'netlify dev' and the function is in 'netlify/functions/'.`);
                    }
                    throw new Error(errorMsg);
                }

                const data = await response.json();

                // Automatic fallback: if rss-proxy got an HTML page instead of XML, retry via scrape-page!
                if (!isScrape && data.error === 'Parse Error') {
                    console.log(`URL is HTML rather than XML, switching to scrape-page for ${url}`);
                    return _fetchAndParseFeed(`${url}#scrape`, attempt);
                }

                // Handle cases where the proxy returns a 200 but the body contains an error object
                if (data.error) {
                    throw new Error(`${data.error}: ${data.details || 'Unknown details'}`);
                }

                if (!data || !data.items || data.items.length === 0) {
                    throw new Error('No items in feed.');
                }

                const items = data.items.map(item => {
                    // RCP images are almost always inside the HTML content as entities
                    let extractedImg = item.thumbnail || (item.enclosure && item.enclosure.url);
                    
                    // Check for the custom mediaThumbnail field from our proxy
                    if (!extractedImg && item.mediaThumbnail && item.mediaThumbnail.$) {
                        extractedImg = item.mediaThumbnail.$.url;
                    }
                    
                    // Check for the custom mediaContent field (common in Fox News)
                    if (!extractedImg && item.mediaContent && item.mediaContent.$) {
                        extractedImg = item.mediaContent.$.url;
                    }
                    
                    if (!extractedImg) {
                        // Look inside encoded content
                        const rawHTML = (item.description || '') + (item.content || '');
                        // Decode once to see if <img> tags appear
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = rawHTML;
                        const searchPool = rawHTML + (tempDiv.textContent || '');
                        
                        const imgMatch = searchPool.match(/<img[^>]+src="([^">]+)"/i);
                        if (imgMatch) extractedImg = imgMatch[1];
                    }

                    return {
                        title: stripHTML(item.title || 'No title'),
                        link: stripHTML(item.link || '#'),
                        // Expanded fallback for different RSS parser formats
                        description: isScrape
                            ? (item.contentSnippet || 'No summary available.')
                            : sanitizeDescription(item.description || item.content || item.contentSnippet || item.summary),
                        pubDate: formatHumanDate(stripHTML(item.pubDate || '')),
                        image: extractedImg
                    };
                });

                return items;
            } catch (error) {
                console.error(`Fetch failed for ${url}:`, error);
                if (attempt < MAX_RETRY_ATTEMPTS) {
                    const delay = INITIAL_RETRY_DELAY_MS * Math.pow(2, attempt - 1);
                    console.log(`Retrying fetch for ${url} (attempt ${attempt + 1}) after ${delay}ms...`);
                    await new Promise(resolve => setTimeout(resolve, delay));
                    return _fetchAndParseFeed(url, attempt + 1);
                }
                throw error;
            }
        }

        function renderPlaceholders(container, count = 3) {
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                const placeholder = document.createElement('div');
                placeholder.className = 'feed-item-placeholder';
                container.appendChild(placeholder);
            }
        }

        function renderIframe(container, url) {
            container.innerHTML = '';
            const iframe = document.createElement('iframe');
            iframe.src = url;
            iframe.style.width = '100%';
            iframe.style.height = 'calc(100vh - 160px)'; 
            iframe.style.border = 'none';
            container.appendChild(iframe);
        }

        async function prefetchFeed(url) {
            // Don't try to prefetch local HTML files as RSS feeds
            if (url.endsWith('.html')) {
                prefetchedFeeds.add(url);
                return;
            }
            // Find all links that match the URL, not just the first one.
            const links = Array.from(document.querySelectorAll(`.sidebar a[data-feed="${url}"]`));
            const loadingIcons = [];

            links.forEach(link => {
                const iconId = `loading-icon-${encodeURIComponent(url)}-${Math.random().toString(36).substr(2, 9)}`;
                const existingIcon = link.parentElement.querySelector('.loading-icon');
                if (existingIcon) existingIcon.remove();

                const loadingIcon = document.createElement('div');
                loadingIcon.className = 'loading-icon';
                loadingIcon.id = iconId;
                loadingIcon.style.display = 'inline-block';
                link.parentElement.appendChild(loadingIcon);
                loadingIcons.push(loadingIcon);
            });

            try {
                const items = await _fetchAndParseFeed(url);
                setCache(url, items);
                prefetchedFeeds.add(url);
                // Enable all matching links now that they are cached.
                links.forEach(link => link.classList.remove('disabled'));
            } catch (error) {
                console.error(`Prefetch failed for ${url}:`, error);
                if (links.length > 0) {
                    const title = links[0].getAttribute('data-title');
                    const errorContainer = document.getElementById('error');
                    errorContainer.innerHTML = `Failed to load ${title}: ${error.message}. <button onclick="fetchFeed('${url}', '${title}', null)">Retry</button>`;
                    errorContainer.style.display = 'block';
                }
            } finally {
                loadingIcons.forEach(icon => icon.remove());
            }
        }

        async function prefetchAllFeeds() {
            const errorContainer = document.getElementById('error');
            const sidebar = document.querySelector('.sidebar');
            const links = Array.from(document.querySelectorAll('.sidebar a[data-feed]'));
            const activeLink = document.querySelector('.sidebar a.active');
            const activeFeedUrl = activeLink ? activeLink.getAttribute('data-feed') : null;
            const activeFeedTitle = activeLink ? activeLink.getAttribute('data-title') : null;

            sidebar.classList.add('loading');
            errorContainer.textContent = 'Refreshing feeds...';
            errorContainer.style.display = 'block';
            errorContainer.classList.add('notification');

            try {
                // 1. Clear existing cache and collect unique feed URLs
                const uniqueUrls = new Set();
                links.forEach(link => {
                    const feedUrl = link.getAttribute('data-feed');
                    if (feedUrl && !feedUrl.endsWith('.html')) {
                        if (getCache(feedUrl)) {
                            clearCache(feedUrl);
                            prefetchedFeeds.delete(feedUrl);
                        }
                        uniqueUrls.add(feedUrl);
                    }
                });

                // 2. Order critical feeds first, followed by remaining unique feeds
                const orderedUrls = [
                    ...CRITICAL_FEEDS.filter(url => uniqueUrls.has(url)),
                    ...[...uniqueUrls].filter(url => !CRITICAL_FEEDS.includes(url))
                ];

                const totalFeeds = orderedUrls.length;
                let completedCount = 0;
                const BATCH_SIZE = 3;

                // 3. Process in parallel batches of 3
                for (let i = 0; i < totalFeeds; i += BATCH_SIZE) {
                    const batch = orderedUrls.slice(i, i + BATCH_SIZE);

                    await Promise.allSettled(
                        batch.map(async (feedUrl) => {
                            if (!prefetchedFeeds.has(feedUrl)) {
                                await prefetchFeed(feedUrl);
                            }
                            completedCount++;
                            const progress = Math.round((completedCount / totalFeeds) * 100);
                            sidebar.style.setProperty('--progress', `${progress}%`);
                        })
                    );

                    // Brief pause between batches to avoid rate-limiting
                    if (i + BATCH_SIZE < totalFeeds) {
                        await new Promise(resolve => setTimeout(resolve, 250));
                    }
                }

                if (activeFeedUrl && activeFeedTitle) {
                    await fetchFeed(activeFeedUrl, activeFeedTitle, activeLink);
                }

                errorContainer.textContent = 'Feeds refreshed successfully!';
                errorContainer.classList.add('notification');
            } catch (error) {
                console.error('Error during prefetchAllFeeds:', error);
                errorContainer.textContent = 'Failed to refresh feeds. Please try again.';
                errorContainer.classList.remove('notification');
            } finally {
                sidebar.classList.remove('loading');
                sidebar.style.setProperty('--progress', '0%');
                setTimeout(() => {
                    errorContainer.style.display = 'none';
                    errorContainer.textContent = '';
                }, 2000);
            }
        }

        function scrollToTop() {
            // This function directly and immediately resets the scroll position.
            const mainContent = document.querySelector('.main-content');
            if (mainContent) {
                mainContent.scrollTop = 0;
            }
            // Also reset the main window's scroll position, as a fallback.
            window.scrollTo(0, 0);
        }

        async function fetchFeed(url, title, activeLink) {
            currentFetchUrl = url;
            exitArticleView();
            const inputGroup = document.querySelector('.input-group');
            let loadingIcon = null;
            updateFavoriteIconsState(url);
            const iconId = activeLink ? `loading-icon-${encodeURIComponent(url)}` : null;

            errorContainer.style.display = 'none';
            if (url && url.endsWith('.html')) {
                feedTitle.textContent = title;
                inputGroup.style.display = 'none';
                renderIframe(feedContainer, url);
                return;
            }

            inputGroup.style.display = 'flex';

            if (iconId) {
                const existingIcon = document.getElementById(iconId);
                if (existingIcon) existingIcon.remove();
            }
            feedTitle.textContent = title || 'Loading...';
            renderPlaceholders(feedContainer);

            if (activeLink) {
                loadingIcon = document.createElement('div');
                loadingIcon.className = 'loading-icon';
                loadingIcon.id = iconId;
                loadingIcon.style.display = 'inline-block';
                activeLink.parentElement.appendChild(loadingIcon);
            }

            if (!url) {
                errorContainer.innerHTML = 'The requested feed is not available.';
                errorContainer.style.display = 'block';
                if (loadingIcon) loadingIcon.remove();
                feedTitle.textContent = title || 'Bobs Stuff';
                feedContainer.innerHTML = '';
                return;
            }

            const cachedItems = getCache(url);
            if (cachedItems && cachedItems.length > 0) {
                feedTitle.textContent = title;
                renderFeedItems(cachedItems, feedContainer);
                scrollToTop();
                if (loadingIcon) loadingIcon.remove();
                return;
            }

            try {
                const items = await _fetchAndParseFeed(url);
                setCache(url, items);

                // Race-condition guard: if the user clicked another feed while waiting, stop here
                if (currentFetchUrl !== url) return;

                feedTitle.textContent = title;
                renderFeedItems(items, feedContainer);
                scrollToTop();
                if (activeLink) activeLink.classList.remove('disabled');
            } catch (error) {
                if (currentFetchUrl !== url) return;

                console.error(`Fetch failed for ${url}:`, error);
                const isRssFile = /rss|feed|xml|atom|rdf|#scrape/i.test(url) || url.includes('/rss');
                if (isRssFile) {
                    const cleanUrl = url.replace(/#scrape$/, '');
                    errorContainer.innerHTML = `<b>Feed Error:</b> ${error.message} <br><br><a href="${cleanUrl}" target="_blank">Open Directly</a> | <button onclick="fetchFeed('${url}', '${title}', null)">Retry</button>`;
                    errorContainer.style.display = 'block';
                    feedContainer.innerHTML = '';
                } else {
                    renderIframe(feedContainer, url);
                }
            } finally {
                if (loadingIcon) loadingIcon.remove();
            }
        }

        let currentFeedItems = [];
        let currentFeedTitle = '';
        let currentOpenInNewTab = false;

        function exitArticleView() {
            const articleControls = document.getElementById('sidebar-article-controls');
            const inputGroup = document.querySelector('.input-group');
            if (articleControls) articleControls.style.display = 'none';
            if (feedTitle) feedTitle.style.display = 'block';
            if (inputGroup) inputGroup.style.display = 'flex';
        }

        function openArticleInRightPanel(articleUrl, articleTitle) {
            const articleControls = document.getElementById('sidebar-article-controls');
            const inputGroup = document.querySelector('.input-group');
            const backBtn = document.getElementById('back-to-feed-btn');
            const originalLink = document.getElementById('open-original-link');

            // 1. Hide the top two rows (title pill & URL input bar)
            if (feedTitle) feedTitle.style.display = 'none';
            if (inputGroup) inputGroup.style.display = 'none';

            // 2. Populate and show the controls under the title block in the left sidebar
            if (backBtn) {
                backBtn.textContent = `← Back to ${currentFeedTitle || 'Feed'}`;
                backBtn.onclick = () => {
                    exitArticleView();
                    feedTitle.textContent = currentFeedTitle;
                    renderFeedItems(currentFeedItems, feedContainer, currentOpenInNewTab);
                    scrollToTop();
                };
            }
            if (originalLink) {
                originalLink.href = articleUrl;
            }
            if (articleControls) {
                articleControls.style.display = 'flex';
            }

            // 3. Render the full-height article iframe in the right panel
            feedContainer.innerHTML = `
                <iframe src="${articleUrl}" style="width: 100%; height: calc(100vh - 95px); border: none; border-radius: 8px; background: #fff;"></iframe>
            `;
            scrollToTop();
        }

        function renderFeedItems(items, feedContainer, openInNewTab = false) {
            currentFeedItems = items;
            currentOpenInNewTab = openInNewTab;
            feedContainer.innerHTML = '';

            items.forEach((item, index) => {
                const feedItem = document.createElement('div');
                feedItem.className = 'feed-item';
                feedItem.style.opacity = '0';

                const targetAttr = openInNewTab ? 'target="_blank" rel="noopener"' : '';
                const imgHtml = item.image && item.image.trim()
                    ? `<img src="${item.image}" alt="" loading="lazy" onerror="this.remove()">`
                    : '';

                feedItem.innerHTML = `
                    ${imgHtml}
                    <div class="feed-item-body">
                        <h2><a href="${item.link}" ${targetAttr} class="article-link">${item.title}</a></h2>
                        <p>${item.description}</p>
                        <div class="meta">Published: ${item.pubDate}</div>
                    </div>
                `;

                if (!openInNewTab) {
                    const linkEl = feedItem.querySelector('.article-link');
                    linkEl?.addEventListener('click', (e) => {
                        e.preventDefault();
                        openArticleInRightPanel(item.link, item.title);
                    });
                }

                feedContainer.appendChild(feedItem);
                setTimeout(() => { feedItem.style.opacity = '1'; }, index * 35);
            });
        }

        // Initialize elements
        const container = document.querySelector('.container');
        const sidebar = document.querySelector('.sidebar');
        const sidebarOverlay = document.querySelector('.sidebar-overlay');
        const toggleModeButton = document.querySelector('.toggle-mode');
        const refreshFeedsButton = document.querySelector('.refresh-feeds');
        const toggleSidebarButton = document.querySelector('.toggle-sidebar');
        const sidebarHeader = document.querySelector('.header-buttons');
        const headerControls = document.querySelector('.header-controls');

        // Load mode preference
        const savedMode = localStorage.getItem('darkMode');
        if (savedMode !== 'light') {
            document.body.classList.add('dark-mode');
            toggleModeButton.textContent = '🌙';
        } else {
            document.body.classList.add('light-mode');
            toggleModeButton.textContent = '🌞';
        }

        // Load sidebar state
        const savedSidebarState = localStorage.getItem('sidebarState');
        const isMobile = window.innerWidth <= 600;
        if (isMobile || savedSidebarState === 'hidden') {
            sidebar.classList.add('sidebar-hidden');
            headerControls.appendChild(toggleModeButton);
            headerControls.appendChild(refreshFeedsButton);
            headerControls.appendChild(toggleSidebarButton);
            toggleSidebarButton.title = 'Show Sidebar';
            toggleSidebarButton.setAttribute('aria-label', 'Show sidebar');
            localStorage.setItem('sidebarState', 'hidden');
        } else {
            sidebarHeader.appendChild(toggleModeButton);
            sidebarHeader.appendChild(refreshFeedsButton);
            sidebarHeader.appendChild(toggleSidebarButton);
            toggleSidebarButton.title = 'Hide Sidebar';
            toggleSidebarButton.setAttribute('aria-label', 'Hide sidebar');
        }

        // Event delegation for button clicks
        function handleInteraction(e) {
            const target = e.target.closest('.toggle-mode, .refresh-feeds, .toggle-sidebar, .sidebar-overlay');
            if (!target) return;

            if (target.classList.contains('toggle-mode')) {
                document.body.classList.toggle('dark-mode');
                document.body.classList.toggle('light-mode');
                const isDarkMode = document.body.classList.contains('dark-mode');
                toggleModeButton.textContent = isDarkMode ? '🌙' : '🌞';
                localStorage.setItem('darkMode', isDarkMode ? 'dark' : 'light');
            } else if (target.classList.contains('refresh-feeds')) {
                prefetchAllFeeds();
            } else if (target.classList.contains('toggle-sidebar') || target.classList.contains('sidebar-overlay')) {
                sidebar.classList.toggle('sidebar-hidden');
                sidebarOverlay.classList.toggle('active');
                const isHidden = sidebar.classList.contains('sidebar-hidden');
                if (isHidden) {
                    headerControls.appendChild(toggleModeButton);
                    headerControls.appendChild(refreshFeedsButton);
                    headerControls.appendChild(toggleSidebarButton);
                    toggleSidebarButton.title = 'Show Sidebar';
                    toggleSidebarButton.setAttribute('aria-label', 'Show sidebar');
                } else {
                    sidebarHeader.appendChild(toggleModeButton);
                    sidebarHeader.appendChild(refreshFeedsButton);
                    sidebarHeader.appendChild(toggleSidebarButton);
                    toggleSidebarButton.title = 'Hide Sidebar';
                    toggleSidebarButton.setAttribute('aria-label', 'Hide sidebar');
                }
                localStorage.setItem('sidebarState', isHidden ? 'hidden' : 'visible');
            }
        }

        container.addEventListener('click', handleInteraction);
        // Removed touchstart listener to avoid interference with link behavior
        sidebarOverlay.addEventListener('click', handleInteraction);
        sidebarOverlay.addEventListener('touchstart', handleInteraction, { passive: false });

        function triggerCustomFeedLoad() {
            const url = rssInput.value.trim();
            if (url) {
                fetchFeed(url, 'Custom Feed', null);
            }
        }

        rssInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                triggerCustomFeedLoad();
            }
        });

        document.getElementById('load-feed-btn').addEventListener('click', triggerCustomFeedLoad);
        document.getElementById('sidebar-content').addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link) return;
            handleSidebarClick(e, link);
        });
        // Refresh current feed on window focus
        window.onfocus = () => {
            const activeLink = document.querySelector('.sidebar a.active');
            if (activeLink) {
                const feedUrl = activeLink.getAttribute('data-feed');
                const feedTitle = activeLink.getAttribute('data-title');
                if (feedUrl) {
                    const cachedItems = getCache(feedUrl);
                    if (!cachedItems || cachedItems.length === 0) {
                        fetchFeed(feedUrl, feedTitle, activeLink);
                    }
                }
            }
        };

        // --- DYNAMIC CONTENT LOADING ---

        async function initializePage() {
            const urlParams = new URLSearchParams(window.location.search);
            const view = urlParams.get('view');
            //const configFile = view === 'priv' ? 'private-links.json' : 'public-links.json';
            const configFile = 'private-links.json';
            const inputGroup = document.querySelector('.input-group');

            try {
                // Function to load JSON using XMLHttpRequest
                function loadJSON(filePath) {
                    return new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.overrideMimeType("application/json");
                        xhr.open('GET', filePath, true);
                        xhr.onload = function () {
                            if (xhr.status === 200) {
                                resolve(JSON.parse(xhr.responseText));
                            } else {
                                reject(`Could not load ${filePath}: ${xhr.status} ${xhr.statusText}`);
                            }
                        };
                        xhr.onerror = function () {
                            reject(`Could not load ${filePath}: Network error`);
                        };
                        xhr.send();
                    });
                }

                // Load the configuration file
                const sections = await loadJSON(configFile);
                loadedConfig = sections; // Store the loaded config globally
                buildSidebar(sections);

                // Initialize with the first available feed
                const firstFeedLink = document.querySelector('.sidebar a[data-feed]');
                if (firstFeedLink) {
                    const feedUrl = firstFeedLink.getAttribute('data-feed');
                    const feedTitle = firstFeedLink.getAttribute('data-title');
                    rssInput.value = feedUrl;

                    const cachedItems = getCache(feedUrl);
                    if (cachedItems && cachedItems.length > 0) {
                        firstFeedLink.classList.add('active');
                        fetchFeed(feedUrl, feedTitle, firstFeedLink);
                    } else {
                        document.getElementById('feed-title').textContent = `Loading ${feedTitle}...`;
                        fetchFeed(feedUrl, feedTitle, firstFeedLink);
                    }
                }

                // Start pre-fetching all feeds after sidebar is built
                prefetchAllFeeds();

                // If in private view, show the heart icon
                if (view === 'priv') {
                   document.getElementById('add-to-favorites').style.display = 'block';
                    document.getElementById('edit-from-favorites').style.display = 'block';
                    document.getElementById('delete-from-favorites').style.display = 'block';
                    setupFavoritesHandler();
                }
                inputGroup.style.display = 'flex';

            } catch (error) {
                console.error("Failed to initialize page:", error);
                const urlParams = new URLSearchParams(window.location.search);
                const view = urlParams.get('view');
                if (view !== 'priv') {
                   document.getElementById('add-to-favorites').style.display = 'none';
                   document.getElementById('edit-from-favorites').style.display = 'none';
                   document.getElementById('delete-from-favorites').style.display = 'none';
                }
                document.getElementById('error').textContent = 'Error loading page configuration. Please try again later.';
                document.getElementById('error').style.display = 'block';
            }
        }

        function buildSidebar(sections, newlyAddedUrl = null) {
            const sidebarContent = document.getElementById('sidebar-content');
            sidebarContent.innerHTML = ''; // Clear any existing content
            let allFeeds = [];


            sections.forEach(section => {
                const sectionHeader = document.createElement('div');
                sectionHeader.className = 'sidebar-section-header';
                sectionHeader.innerHTML = `<hr><span>${section.title}</span>`;
                sidebarContent.appendChild(sectionHeader);

                const ul = document.createElement('ul');
                ul.setAttribute('role', 'navigation');
                ul.setAttribute('aria-label', section.title);

                section.links.forEach(link => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = link.href || '#';
                    a.textContent = link.title;
                    if (link.feed) {
                        a.setAttribute('data-feed', link.feed);
                        a.setAttribute('data-title', link.title);
                        // Only disable actual RSS feeds, not local HTML pages
                        // Also, don't disable feeds that have already been successfully prefetched
                        if (link.feed !== newlyAddedUrl && !link.feed.endsWith('.html') && !prefetchedFeeds.has(link.feed)) {
                            a.classList.add('disabled');
                        }
                        if (!link.feed.endsWith('.html')) {
                            allFeeds.push(link.feed);
                        }
                    }

                    if (link.target) a.target = link.target;
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                sidebarContent.appendChild(ul);
            });
            CRITICAL_FEEDS = allFeeds; // All feeds are now considered critical for prefetching
        }

        function handleSidebarClick(e, link) {
            const feedUrl = link.getAttribute('data-feed');
            const hrefUrl = link.getAttribute('href');
            const feedTitle = link.getAttribute('data-title');
            const managementUrl = feedUrl || (hrefUrl !== '#' ? hrefUrl : null);

            if (!managementUrl) return;

            document.querySelectorAll('.sidebar a').forEach(l => l.classList.remove('active'));
            link.classList.add('active');
            rssInput.value = managementUrl;
            updateFavoriteIconsState(managementUrl);

            if (feedUrl) {
                e.preventDefault();
                if (link.classList.contains('disabled')) {
                    errorContainer.innerHTML = `This feed is still loading. Please wait or <button onclick="fetchFeed('${feedUrl}', '${feedTitle}', null)">try now</button>.`;
                    errorContainer.style.display = 'block';
                    return;
                }
                fetchFeed(feedUrl, feedTitle, link);
            }

            if (window.innerWidth <= 600) {
                const sidebar = document.querySelector('.sidebar');
                const sidebarOverlay = document.querySelector('.sidebar-overlay');
                const headerControls = document.querySelector('.header-controls');
                sidebar.classList.add('sidebar-hidden');
                sidebarOverlay.classList.remove('active');
                headerControls.appendChild(toggleModeButton);
                headerControls.appendChild(refreshFeedsButton);
                headerControls.appendChild(toggleSidebarButton);
                toggleSidebarButton.title = 'Show Sidebar';
                toggleSidebarButton.setAttribute('aria-label', 'Show sidebar');
                localStorage.setItem('sidebarState', 'hidden');
            }
        }

        function updateFavoriteIconsState(currentUrl) {
            const heartButton = document.getElementById('add-to-favorites');
            const deleteButton = document.getElementById('delete-from-favorites');
            const editButton = document.getElementById('edit-from-favorites');
            if (!heartButton || heartButton.style.display === 'none') return; // Both icons are managed together

            // Check if the URL is already in our loaded configuration
            let isFavorite = false;
            if (currentUrl) {
                isFavorite = loadedConfig.some(section =>
                    section.links.some(link => link.feed === currentUrl || link.href === currentUrl)
                );
            }

            // The heart (add) button is enabled if it's NOT a favorite
            // Also disable if the URL is empty (e.g., on initial load with no selection)
            heartButton.disabled = isFavorite || !currentUrl;
            heartButton.title = isFavorite ? 'Already in Favorites' : 'Add to Favorites';

            // The delete button is enabled if it IS a favorite
            deleteButton.disabled = !isFavorite;
            deleteButton.title = isFavorite ? 'Delete from Favorites' : 'Not in Favorites';

            // The edit button is also enabled if it IS a favorite
            editButton.disabled = !isFavorite;
            editButton.title = isFavorite ? 'Edit Favorite' : 'Not in Favorites';
        }

        //##############################################################################

        function setupFavoritesHandler() {
            initAddFavoriteModal();
            initEditFavoriteModal();
            initDeleteFavorite();
        }

        function initAddFavoriteModal() {
            const heartButton = document.getElementById('add-to-favorites');
            const modal = document.getElementById('add-feed-modal');
            const modalCancel = document.getElementById('modal-cancel-btn');
            const modalSave = document.getElementById('modal-save-btn');
            const newFeedTitleInput = document.getElementById('new-feed-title');
            const privateOnlyCheckbox = document.getElementById('private-only-checkbox');
            const newTabCheckbox = document.getElementById('new-tab-checkbox');
            const scrapeCheckbox = document.getElementById('scrape-page-checkbox');
            const newFeedSectionSelect = document.getElementById('new-feed-section');

            // Automatically uncheck "Scrape" if "Open in new tab" is checked
            newTabCheckbox?.addEventListener('change', () => {
                if (newTabCheckbox.checked && scrapeCheckbox) {
                    scrapeCheckbox.checked = false;
                }
            });

            heartButton.addEventListener('click', () => {
                if (heartButton.disabled) return;

                newFeedSectionSelect.innerHTML = '';
                loadedConfig.forEach(section => {
                    const option = document.createElement('option');
                    option.value = section.title;
                    option.textContent = section.title;
                    newFeedSectionSelect.appendChild(option);
                });

                // Pre-check the scrape box if the user already typed #scrape in the URL input
                if (scrapeCheckbox) {
                    scrapeCheckbox.checked = rssInput.value.trim().endsWith('#scrape');
                }

                modal.style.display = 'flex';
                newFeedTitleInput.focus();
            });

            modalCancel.addEventListener('click', () => {
                modal.style.display = 'none';
                newFeedTitleInput.value = '';
                newTabCheckbox.checked = false;
                if (scrapeCheckbox) scrapeCheckbox.checked = false;
            });

            modalSave.addEventListener('click', async () => {
                const newTitle = newFeedTitleInput.value.trim();
                const selectedSectionTitle = newFeedSectionSelect.value;
                let newUrl = rssInput.value.trim().replace(/#scrape$/, '');

                if (!newTitle || !newUrl || !selectedSectionTitle) {
                    alert('Please provide a title and select a section.');
                    return;
                }

                if (scrapeCheckbox && scrapeCheckbox.checked && !newTabCheckbox.checked) {
                    newUrl += '#scrape';
                }

                const newLinkObject = newTabCheckbox.checked
                    ? { href: newUrl, title: newTitle, target: '_blank' }
                    : { feed: newUrl, title: newTitle };

                const targetSection = loadedConfig.find(s => s.title === selectedSectionTitle);
                if (targetSection) {
                    targetSection.links.push(newLinkObject);
                } else {
                    alert('Could not find the selected section. Please try again.');
                    return;
                }

                // Always save to the private config
                downloadJson(loadedConfig, 'private-links.json');

                // If "Private Only" is unchecked, also save to the public config
                if (!privateOnlyCheckbox.checked) {
                    try {
                        const publicConfigResponse = await fetch('public-links.json');
                        if (!publicConfigResponse.ok) throw new Error('Failed to load public config');
                        const publicConfig = await publicConfigResponse.json();

                        const publicTargetSection = publicConfig.find(s => s.title === selectedSectionTitle);
                        if (publicTargetSection) {
                            publicTargetSection.links.push(newLinkObject);
                            downloadJson(publicConfig, 'public-links.json');
                        } else {
                            alert(`Section "${selectedSectionTitle}" not found in public-links.json. The public file was not updated.`);
                        }
                    } catch (error) {
                        console.error("Could not update public config:", error);
                        alert("Failed to load and update public-links.json. Please check the console for errors.");
                    }
                }

                modal.style.display = 'none';
                newFeedTitleInput.value = '';
                newTabCheckbox.checked = false;
                if (scrapeCheckbox) scrapeCheckbox.checked = false;

                rssInput.value = newUrl;
                buildSidebar(loadedConfig, newUrl);
                updateFavoriteIconsState(newUrl);
            });
        }

        function initEditFavoriteModal() {
            const editButton = document.getElementById('edit-from-favorites');
            const editModal = document.getElementById('edit-feed-modal');
            const editModalCancel = document.getElementById('edit-modal-cancel-btn');
            const editModalSave = document.getElementById('edit-modal-save-btn');
            const editFeedTitleInput = document.getElementById('edit-feed-title');
            const editFeedUrlInput = document.getElementById('edit-feed-url');
            const editFeedSectionSelect = document.getElementById('edit-feed-section');
            const editPrivateOnlyCheckbox = document.getElementById('edit-private-only-checkbox');
            const editNewTabCheckbox = document.getElementById('edit-new-tab-checkbox');
            const editScrapeCheckbox = document.getElementById('edit-scrape-page-checkbox');

            let originalUrlToEdit = null;

            editButton.addEventListener('click', async () => {
                if (editButton.disabled) return;

                const cleanInputUrl = rssInput.value.trim().replace(/#scrape$/, '');
                if (!cleanInputUrl) return;

                let linkToEdit = null;
                let sectionOfLink = null;

                // Match against loadedConfig regardless of whether #scrape is present
                for (const section of loadedConfig) {
                    const foundLink = section.links.find(link => {
                        const saved = (link.feed || link.href || '').replace(/#scrape$/, '');
                        return saved === cleanInputUrl;
                    });
                    if (foundLink) {
                        linkToEdit = foundLink;
                        sectionOfLink = section;
                        originalUrlToEdit = foundLink.feed || foundLink.href;
                        break;
                    }
                }

                if (!linkToEdit) {
                    alert('Could not find the selected link to edit.');
                    return;
                }

                const rawSavedUrl = linkToEdit.feed || linkToEdit.href || '';
                const hasScrapeFlag = rawSavedUrl.includes('#scrape');

                // Pre-populate the edit modal inputs and checkboxes
                editFeedTitleInput.value = linkToEdit.title;
                editFeedUrlInput.value = rawSavedUrl.replace(/#scrape$/, '');
                editNewTabCheckbox.checked = !!(linkToEdit.openArticlesInNewTab || linkToEdit.target);
                if (editScrapeCheckbox) {
                    editScrapeCheckbox.checked = hasScrapeFlag;
                }

                // Populate and select the section dropdown
                editFeedSectionSelect.innerHTML = '';
                loadedConfig.forEach(section => {
                    const option = document.createElement('option');
                    option.value = section.title;
                    option.textContent = section.title;
                    editFeedSectionSelect.appendChild(option);
                });
                editFeedSectionSelect.value = sectionOfLink.title;

                // Pre-populate the "Private Only" checkbox
                try {
                    const publicConfigResponse = await fetch('public-links.json');
                    const publicConfig = await publicConfigResponse.json();
                    const isInPublic = publicConfig.some(section =>
                        section.links.some(link => {
                            const savedPublic = (link.feed || link.href || '').replace(/#scrape$/, '');
                            return savedPublic === cleanInputUrl;
                        })
                    );
                    editPrivateOnlyCheckbox.checked = !isInPublic;
                } catch (error) {
                    console.error("Could not check public config, defaulting 'Private Only' to true.", error);
                    editPrivateOnlyCheckbox.checked = true;
                }

                editModal.style.display = 'flex';
            });

            editModalCancel.addEventListener('click', () => {
                editModal.style.display = 'none';
                originalUrlToEdit = null;
            });

            editModalSave.addEventListener('click', async () => {
                if (!originalUrlToEdit) return;

                const newTitle = editFeedTitleInput.value.trim();
                const newSectionTitle = editFeedSectionSelect.value;
                const openArticlesInNewTab = editNewTabCheckbox.checked;
                let newUrl = editFeedUrlInput.value.trim().replace(/#scrape$/, '');

                if (!newTitle || !newUrl || !newSectionTitle) {
                    alert('Please provide a title, URL, and section.');
                    return;
                }

                if (editScrapeCheckbox && editScrapeCheckbox.checked) {
                    newUrl += '#scrape';
                }

                // 1. Remove the old link object
                const cleanOriginal = originalUrlToEdit.replace(/#scrape$/, '');
                loadedConfig.forEach(section => {
                    section.links = section.links.filter(link => {
                        const saved = (link.feed || link.href || '').replace(/#scrape$/, '');
                        return saved !== cleanOriginal;
                    });
                });

                // 2. Keep standalone .html pages as href; save all feeds with openArticlesInNewTab flag
                const isLocalPage = newUrl.endsWith('.html');
                const newLinkObject = isLocalPage
                    ? { href: newUrl, title: newTitle, ...(openArticlesInNewTab ? { target: '_blank' } : {}) }
                    : { feed: newUrl, title: newTitle, openArticlesInNewTab };

                // 3. Add the updated link object to the selected section
                const newSection = loadedConfig.find(s => s.title === newSectionTitle);
                if (newSection) {
                    newSection.links.push(newLinkObject);
                }

                downloadJson(loadedConfig, 'private-links.json');

                // 4. Update public-links.json if applicable
                try {
                    const publicConfigResponse = await fetch('public-links.json');
                    let publicConfig = await publicConfigResponse.json();

                    publicConfig.forEach(section => {
                        section.links = section.links.filter(link => {
                            const saved = (link.feed || link.href || '').replace(/#scrape$/, '');
                            return saved !== cleanOriginal;
                        });
                    });

                    if (!editPrivateOnlyCheckbox.checked) {
                        const publicTargetSection = publicConfig.find(s => s.title === newSectionTitle);
                        if (publicTargetSection) publicTargetSection.links.push(newLinkObject);
                    }

                    downloadJson(publicConfig, 'public-links.json');
                } catch (error) {
                    console.error('Could not update public-links.json:', error);
                    alert('Could not update public-links.json. Please check the console.');
                }

                editModal.style.display = 'none';
                originalUrlToEdit = null;
                buildSidebar(loadedConfig, newUrl);
                rssInput.value = newUrl;
                updateFavoriteIconsState(newUrl);
                alert('Favorite updated. The updated JSON file(s) have been downloaded.');
            });
        }

        //##############################################################################

        // Set dynamic version date in footer
        (function setVersionDate() {
            const versionElement = document.getElementById('version-date');
            if (versionElement) {
                versionElement.textContent = APP_VERSION;
            }
        })();

        // Expose necessary functions to window for dynamic HTML calls
        window.fetchFeed = fetchFeed;

        // Start the application
        document.addEventListener('DOMContentLoaded', initializePage);
    })();
    </script>
